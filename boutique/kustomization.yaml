# Pose le namespace une fois pour les 34 objets, au lieu de le répéter.
# ArgoCD bascule en mode kustomize à la seule présence de ce fichier.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique

resources:
  - kubernetes-manifests.yaml
  - ingress.yaml

# Les manifests d'Online Boutique ne déclarent pas `replicas`. Un champ absent
# de l'état désiré n'est pas réconcilié : un `kubectl scale` à la main passait
# donc inaperçu d'ArgoCD. On le déclare ici pour que le nombre de replicas
# devienne la propriété de Git.
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 1

  # Le Service frontend-external est de type LoadBalancer. Un cluster local
  # n'a pas de fournisseur de LoadBalancer : il reste indéfiniment Pending, et
  # ArgoCD garde l'application en Progressing. L'exposition passe par
  # l'Ingress Traefik, ce Service ne sert donc à rien ici.
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
      $patch: delete
