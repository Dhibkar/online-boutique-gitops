# Cible le service frontend (ClusterIP), et non frontend-external, qui est un
# LoadBalancer sans fournisseur sur un cluster local.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boutique
spec:
  ingressClassName: traefik
  rules:
    - host: boutique.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
